services:
  agent-move:
    build: .
    image: agent-move:local
    container_name: agent-move
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      AGENT_MOVE_HOST: 0.0.0.0
      AGENT_MOVE_PORT: 3333

      # Enable only the collectors you actually mount below.
      AGENT_MOVE_OPENCODE: "true"
      AGENT_MOVE_CLAUDE: "false"
      AGENT_MOVE_CODEX: "false"
      AGENT_MOVE_PI: "false"

      # One or more OpenCode SQLite databases, comma-separated as id=/path/opencode.db.
      # The default below reads OpenCode running directly on this host.
      AGENT_MOVE_OPENCODE_SOURCES: "host=/sources/opencode/opencode.db"

      # Uncomment when Claude Code is mounted below.
      AGENT_MOVE_CLAUDE_HOME: /sources/claude

      # Uncomment when Codex CLI is mounted below.
      AGENT_MOVE_CODEX_SESSIONS: /sources/codex/sessions

      # HUB MODE: uncomment on your main AgentMove instance to aggregate other nodes.
      # Each remote node only needs to expose its AgentMove HTTP port over your private network.
      # AGENT_MOVE_REMOTE_SOURCES: "work=http://work-laptop:3333,server=http://livalyo-server:3333"
      # AGENT_MOVE_REMOTE_POLL_MS: "1000"

    volumes:
      # OpenCode installed/running on this host.
      - ${HOME}/.local/share/opencode:/sources/opencode:ro

      # Claude Code sessions on this host.
      # Uncomment together with AGENT_MOVE_CLAUDE=true above.
      # - ${HOME}/.claude:/sources/claude:ro

      # Codex CLI sessions on this host.
      # Uncomment together with AGENT_MOVE_CODEX=true above.
      # - ${HOME}/.codex/sessions:/sources/codex/sessions:ro

      # OpenCode running in another Docker container can be observed by mounting
      # the SAME named volume read-only into AgentMove. Example:
      # - opencode-worker-1:/sources/opencode-worker-1:ro
      # - opencode-worker-2:/sources/opencode-worker-2:ro
      # Then change AGENT_MOVE_OPENCODE_SOURCES to:
      # "worker1=/sources/opencode-worker-1/opencode.db,worker2=/sources/opencode-worker-2/opencode.db"

# If you observe named volumes owned by other Compose projects, declare them here
# as external volumes using their real Docker volume names.
# volumes:
#   opencode-worker-1:
#     external: true
#     name: livalyo_opencode-worker-1
#   opencode-worker-2:
#     external: true
#     name: livalyo_opencode-worker-2
